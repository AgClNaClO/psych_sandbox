[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psych-sandbox"
version = "0.3.0"
description = "Research-only multi-agent psychological counseling sandbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "coverage>=7.0"]
training = ["transformers>=4.45", "datasets>=3.0", "peft>=0.13", "trl>=0.11"]

[project.scripts]
psych-sandbox = "psychsandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
